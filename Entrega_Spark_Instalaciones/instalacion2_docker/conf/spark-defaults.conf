# Configuracion por defecto para las aplicaciones lanzadas desde JupyterLab (PySpark y spark-shell)

# Conexion con el cluster
spark.master                                  spark://spark-master:7077
spark.driver.host                             jupyter

# Recursos de cada aplicacion: 3 executors de 1 nucleo y 1 GB (uno por worker)
spark.executor.cores                          1
spark.executor.memory                         1g
spark.cores.max                               3

# Persistencia de las tablas (solo se usa si la sesion activa el soporte de Hive)
spark.sql.warehouse.dir                       /opt/datos/warehouse
spark.hadoop.javax.jdo.option.ConnectionURL   jdbc:derby:;databaseName=/opt/metastore/metastore_db;create=true
spark.driver.extraJavaOptions                 -Dderby.system.home=/opt/metastore
