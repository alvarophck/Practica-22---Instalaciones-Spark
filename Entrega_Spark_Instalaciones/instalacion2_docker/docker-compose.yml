name: spark-cluster

services:

  spark-master:
    build: .
    image: spark-curso:4.1.4
    container_name: spark-master
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master",
              "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    ports:
      - "8080:8080"     # interfaz web del master
      - "7077:7077"     # puerto del cluster
    volumes:
      - ./datos:/opt/datos

  spark-worker-1:
    image: spark-curso:4.1.4
    container_name: spark-worker-1
    hostname: spark-worker-1
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "spark://spark-master:7077",
              "--cores", "2", "--memory", "2g",
              "--webui-port", "8081", "--work-dir", "/opt/spark/work-dir"]
    ports:
      - "8081:8081"
    volumes:
      - ./datos:/opt/datos
    depends_on:
      - spark-master

  spark-worker-2:
    image: spark-curso:4.1.4
    container_name: spark-worker-2
    hostname: spark-worker-2
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "spark://spark-master:7077",
              "--cores", "2", "--memory", "2g",
              "--webui-port", "8081", "--work-dir", "/opt/spark/work-dir"]
    ports:
      - "8082:8081"
    volumes:
      - ./datos:/opt/datos
    depends_on:
      - spark-master

  spark-worker-3:
    image: spark-curso:4.1.4
    container_name: spark-worker-3
    hostname: spark-worker-3
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "spark://spark-master:7077",
              "--cores", "2", "--memory", "2g",
              "--webui-port", "8081", "--work-dir", "/opt/spark/work-dir"]
    ports:
      - "8083:8081"
    volumes:
      - ./datos:/opt/datos
    depends_on:
      - spark-master

  jupyter:
    image: spark-curso:4.1.4
    container_name: jupyter
    hostname: jupyter
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser",
              "--ServerApp.root_dir=/home/spark/notebooks"]
    environment:
      JUPYTER_TOKEN: spark
      JDK_JAVA_OPTIONS: >-
        -Dlog4j2.configurationFile=/opt/spark/conf/log4j2.properties
        --add-opens=java.base/java.lang=ALL-UNNAMED
        --add-opens=java.base/java.lang.invoke=ALL-UNNAMED
        --add-opens=java.base/java.lang.reflect=ALL-UNNAMED
        --add-opens=java.base/java.io=ALL-UNNAMED
        --add-opens=java.base/java.net=ALL-UNNAMED
        --add-opens=java.base/java.nio=ALL-UNNAMED
        --add-opens=java.base/java.util=ALL-UNNAMED
        --add-opens=java.base/java.util.concurrent=ALL-UNNAMED
        --add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED
        --add-opens=java.base/jdk.internal.ref=ALL-UNNAMED
        --add-opens=java.base/sun.nio.ch=ALL-UNNAMED
        --add-opens=java.base/sun.nio.cs=ALL-UNNAMED
        --add-opens=java.base/sun.security.action=ALL-UNNAMED
        --add-opens=java.base/sun.util.calendar=ALL-UNNAMED
        --add-opens=java.security.jgss/sun.security.krb5=ALL-UNNAMED
        -Djdk.reflect.useDirectMethodHandle=false
        -Dio.netty.tryReflectionSetAccessible=true
    ports:
      - "8888:8888"     # JupyterLab
      - "4040:4040"     # interfaz web de la primera aplicacion de Spark
      - "4041:4041"     # interfaz web de la segunda aplicacion de Spark
    volumes:
      - ./notebooks:/home/spark/notebooks
      - ./datos:/opt/datos
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - metastore:/opt/metastore
    depends_on:
      - spark-worker-1
      - spark-worker-2
      - spark-worker-3

volumes:
  metastore:
